[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-support-copilot"
version = "0.1.0"
description = "Production AI Support Copilot Backend"
requires-python = ">=3.11"

# Direct dependencies only — transitive deps are handled by pip-compile
dependencies = [
    # Web framework
    "fastapi>=0.111,<0.112",
    "uvicorn[standard]>=0.29,<0.30",

    # Database — ORM + migrations + async driver
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<0.30",          # async PostgreSQL driver
    "psycopg2-binary>=2.9,<3.0",    # sync driver for alembic migrations

    # Vector database
    "chromadb>=0.5,<0.6",

    # AI / ML
    "openai>=1.30,<2.0",

    # PDF extraction
    "pymupdf>=1.24,<2.0",           # fitz — fast, accurate, handles scanned docs

    # Text chunking
    "langchain-text-splitters>=0.2,<0.3",  # well-tested chunking primitives

    # Config + validation
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",  # env var loading with type validation

    # HTTP client (for internal service calls)
    "httpx>=0.27,<0.28",

    # Observability
    "structlog>=24.1,<25.0",        # structured JSON logging

    # File handling
    "python-multipart>=0.0.9",      # FastAPI file upload support
    "aiofiles>=23.2,<24.0",         # async file I/O
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<0.24",
    "pytest-cov>=5.0,<6.0",
    "httpx>=0.27,<0.28",            # TestClient for FastAPI
    "ruff>=0.4,<0.5",               # linter + formatter
    "mypy>=1.10,<2.0",              # type checker
    "pip-tools>=7.4,<8.0",          # pip-compile
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
